name: Run AI Trading Scanner

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Allows manual trigger from GitHub Actions tab

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Required to push changes back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scanner.txt

      - name: Run Scanner Script
        run: python scanner.py

      - name: Commit and push changes to trade log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_log.csv
          git commit -m "Auto-update trade logs from SMC scanner" || echo "No changes to commit"
          git push
